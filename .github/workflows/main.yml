name: Auto Update Rules with Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '10 23 * * *'

jobs:
  update-and-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.MY_GH_TOKEN }}
          fetch-depth: 0

      - name: Setup Git
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@users.noreply.github.com"

      - name: Sync Multiple Files from Upstream
        run: |
          git remote add upstream https://github.com/Johnshall/Shadowrocket-ADBlock-Rules-Forever.git
          git fetch upstream
          
          # 检出多个文件，但排除 .github 目录
          git checkout upstream/release -- .
          # 恢复我们的工作流文件（如果有被覆盖）
          git checkout HEAD -- .github/
          
          echo "Files synced from upstream, but kept our workflow files"

      - name: Update Block Rules
        run: |
          # 现在文件已更新到上游最新版本，添加自定义规则
          if ! grep -q "! Custom Rule Added by Auto Update" sr_top500_whitelist_ad.conf; then
            echo "! Custom Rule Added by Auto Update" >> sr_top500_whitelist_ad.conf
            sed -i '/苹果域名及其 CDN 代理/a\DOMAIN-SUFFIX,apple-relay.apple.com,Proxy' *.conf
            sed -i '/苹果域名及其 CDN 代理/a\DOMAIN-SUFFIX,gspe1-ssl.ls.apple.com,Proxy' *.conf
            sed -i '/苹果域名及其 CDN 代理/a\DOMAIN-SUFFIX,guzzoni.apple.com,Proxy' *.conf
            sed -i '/苹果域名及其 CDN 代理/a\DOMAIN-SUFFIX,apple-relay.cloudflare.com,Proxy' *.conf
            sed -i '/苹果域名及其 CDN 代理/a\DOMAIN-SUFFIX,apple-relay.fastly-edge.com,Proxy' *.conf
            sed -i '/苹果域名及其 CDN 代理/a\DOMAIN-SUFFIX,cp4.cloudflare.com,Proxy' *.conf
            sed -i '/苹果域名及其 CDN 代理/a\DOMAIN-SUFFIX,smoot.apple.com,Proxy' *.conf
            sed -i '/ls.apple.com,Direct/d' *.conf
            echo "Custom rules added successfully"
          else
            echo "Custom rules already exist, skipping addition"
          fi
      - name: Inject Intranet Rules
        run: |
          MARK="# Intranet routes (injected)"
          for f in *.conf; do
            grep -q "$MARK" "$f" && continue
            { echo "$MARK"
              echo "IP-CIDR,192.168.199.0/24,PROXY,no-resolve"
              echo "IP-CIDR,172.31.0.0/16,PROXY,no-resolve"
              cat "$f"; } > "$f.new" && mv "$f.new" "$f"
          done

      - name: Commit Changes
        run: |
          # 检查是否有变化需要提交
          if git diff --quiet; then
            echo "No changes to commit"
          else
            git add *.conf
            git commit -m "Automated update: sync upstream and add custom rules"
            git push
          fi

      - name: Create Pull Request
        uses: repo-sync/pull-request@v2
        with:
          destination_branch: "release"
          pr_title: "Automated Update: Sync Upstream & Add Custom Rules"
          pr_body: "This PR is automatically created by GitHub Actions. Synced with the latest upstream changes before applying custom rules."
          github_token: ${{ secrets.MY_GH_TOKEN }}
